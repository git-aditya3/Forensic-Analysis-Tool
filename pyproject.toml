[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-forensic-tool"
version = "0.1.0"
description = "Dependency-free DVR/NVR forensic acquisition and recovery workstation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Aditya"}]
dependencies = []

[project.scripts]
forensic-tool = "forensic_tool.cli:main"

[tool.setuptools.packages.find]
include = ["forensic_tool*"]

[tool.setuptools.package-data]
forensic_tool = []
