[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-forensic-tool"
version = "0.1.0"
description = "DVR/NVR forensic acquisition, recovery, and video analytics workstation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Aditya"}]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8,<5",
    "imageio-ffmpeg>=0.6,<1",
]

[project.scripts]
forensic-tool = "forensic_tool.cli:main"

[tool.setuptools.packages.find]
include = ["forensic_tool*"]

[tool.setuptools.package-data]
forensic_tool = ["model_assets/*.onnx"]
